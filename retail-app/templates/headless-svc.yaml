apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-headless-svc
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: {{ .Values.headless.clusterIP }}
  selector:
    app: {{ .Values.stateful.label }}
  ports:
    - port: {{ .Values.headless.port }}
      targetPort: {{ .Values.stateful.containerPort }}
