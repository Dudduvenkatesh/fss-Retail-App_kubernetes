apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.labels.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.labels.app }}
    spec:
      containers:
      - name: {{ .Values.deployment.name }}
        image: "{{ .Values.deployment.image.repository }}:{{ .Values.deployment.image.tag }}"
        ports:
        - containerPort: {{ .Values.service.mongodb.port }}
        env:
          - name: MONGODB_URI
            valueFrom:
              configMapKeyRef: 
                name: {{ .Values.config.name }}
                key: MONGODB_URI
          - name: SESSION_SECRET
            valueFrom:
              configMapKeyRef:
                name: {{ .Values.config.name }}
                key: SESSION_SECRET
          - name: PORT
            valueFrom:
              configMapKeyRef:
                name: {{ .Values.config.name }}
                key: PORT 
          - name: EMAIL_USER
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secret.name }}
                key: EMAIL_USER
          - name: EMAIL_PASS
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secret.name }}
                key: EMAIL_PASS

