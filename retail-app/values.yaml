namespace: venkatesh-ns

secret:
  name: retail-release-secret 
  type: Opaque
  data:
    EMAIL_USER: Y2hhZ2FudHl0ZWphMjUwMkBnbWFpbC5jb20=
    EMAIL_PASS: eXhvcSBianVrIHJkbnQgYWx6cA==

config:
  name: retail-release-config
  data:
    MONGODB_URI: "mongodb://retail-release-headless-svc:27017/myDatabase"
    SESSION_SECRET: "1234"
    PORT: "3130"
    MONGO_INITDB_DATABASE: "myDatabase"

deployment: 
  labels:
    app: retail
  name: retail-container
  replicas: 4
  image:
    repository: saiteja2502/userprofileretail
    tag: latest

service:
  type: LoadBalancer 
  protocol: TCP
  mongodb:
    port: 3130

headless:
  app: mongodb
  port: 27017
  clusterIP: None


stateful:
  labels:
    app: mongodb
  serviceName: "retail-release-headless-svc"
  replicas: 3
  name: mongo-data
  mountPath: /data/db
  accessModes: ["ReadWriteOnce"]
  storage: 1Gi
  sc: retail-release-storageclass
  image: mongo:latest

storageclasses:
  provisioner: ebs.csi.aws.com
  type: gp3 
  reclaimPolicy: Retain 
  volumeBindingMode: WaitForFirstConsumer

pvc:
  storageClassName: retail-release-storageclass
  accessModes: 
    ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
